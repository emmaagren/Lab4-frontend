<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 – Inloggning</title>
</head>

<body>
    <header>
        <h1>Mina anteckningar</h1>
    </header>

    <main>
        <section>
            <h2>Logga in</h2>

            <form id="loginForm">
                <label for="username">Användarnamn</label>
                <input type="text" id="username" required>

                <label for="password">Lösenord</label>
                <input type="password" id="password" required>

                <button type="submit">Logga in</button>
            </form>

            <p id="message"></p>
        </section>

        <section>
            <h2>Skapa konto</h2>

            <form id="registerForm">
                <label for="registerUsername">Användarnamn</label>
                <input type="text" id="registerUsername" required>

                <label for="registerPassword">Lösenord</label>
                <input type="password" id="registerPassword" required>

                <button type="submit">Registrera dig</button>
            </form>

            <p id="registerMessage" aria-live="polite"></p>
        </section>

        <section id="notesSection" hidden>
            <h2>Mina anteckningar</h2>

            <button id="logoutBtn" type="button">Logga ut</button>

            <h3>Skapa ny anteckning</h3>

            <form id="noteForm">
                <label for="noteTitle">Rubrik</label>
                <input type="text" id="noteTitle" required>

                <label for="noteContent">Innehåll</label>
                <textarea id="noteContent" rows="4" required></textarea>

                <button type="submit">Spara anteckning</button>
            </form>

            <p id="saveNoteMessage" aria-live="polite"></p>

            <button id="loadNotesBtn" type="button">
                Visa mina anteckningar
            </button>

            <ul id="notesList"></ul>

            <p id="notesMessage" aria-live="polite"></p>
        </section>

    </main>
    <script src="script.js"></script>
</body>

</html>
