<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina anteckningar - Lab 4</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Mina anteckningar</h1>
    </header>

    <main>
        <section id="notesSection" hidden>
            <h2>Mina anteckningar</h2>

            <button id="logoutBtn" type="button">Logga ut</button>

            <h3>Skapa ny anteckning</h3>

            <form id="noteForm">
                <label for="noteTitle">Rubrik</label>
                <input type="text" id="noteTitle" required>

                <label for="noteContent">Innehåll</label>
                <textarea id="noteContent" rows="4" required></textarea>

                <button type="submit">Spara anteckning</button>
            </form>

            <p id="saveNoteMessage" aria-live="polite"></p>

            <button id="loadNotesBtn" type="button">
                Visa mina anteckningar
            </button>

            <ul id="notesList"></ul>

            <p id="notesMessage" aria-live="polite"></p>
        </section>

    </main>

    <script src="notes.js"></script>

</body>

</html>
